<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kristian Davis — Links</title>
  <meta name="description" content="Quick links for Kristian Davis — Portfolio, LinkedIn, and Behance.">
  <style>
    :root {
      --navy: #0E1B2C;
      --salmon: #FF6B6B;
      --mint: #2DD4BF;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--navy);
      color: #EEF2F6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 64px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid rgba(255,255,255,0.08);
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    h1 {
      font-size: clamp(22px, 3.6vw, 28px);
      margin: 0;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .tag {
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      padding: 4px 8px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
    }
    p.note {
      margin: 0;
      opacity: 0.85;
      line-height: 1.5;
    }

    .links {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 8px;
    }
    @media (min-width: 560px) {
      .links {
        grid-template-columns: 1fr;
        gap: 18px;
      }
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-weight: 700;
      font-size: clamp(16px, 2.8vw, 18px);
      padding: 18px 22px;
      border-radius: 16px;
      height: 64px; /* same size for all */
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.10);
      color: #F7FAFC;
      position: relative;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      transition: transform 0.08s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .link-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.20);
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
    }
    .link-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--mint), 0 6px 20px rgba(0,0,0,0.25);
    }

    /* salmon accent underline on hover/focus */
    .link-btn::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 8px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--salmon), color-mix(in oklab, var(--salmon) 60%, var(--mint)));
      opacity: 0.65;
      transition: opacity 0.2s ease;
    }
    .link-btn:hover::after,
    .link-btn:focus-visible::after { opacity: 1; }

    footer {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
    }
    .accent-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--salmon);
      box-shadow: 0 0 0 3px rgba(255,107,107,0.25);
    }
    .mint-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 2px rgba(45,212,191,0.25);
    }
    .row { display:flex; align-items:center; gap:8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Kristian Davis</h1>
        <span class="tag">Links</span>
      </div>
      <div class="row">
        <span class="accent-dot" title="salmon accent"></span>
        <span class="mint-dot" title="mint accent"></span>
      </div>
    </header>
    <p class="note">Don't forget to bookmark me!</p>
    <p class="note">Tap a button to open:</p>
    <div class="links">
      <a class="link-btn" href="https://kdavisdesigns0663.github.io/portfolio-website/" target="_blank" rel="noopener noreferrer" aria-label="Portfolio – opens in new tab">Portfolio</a>
<a class="link-btn" href="https://www.linkedin.com/in/kdavisdesigns" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn – opens in new tab">LinkedIn</a>
<a class="link-btn" href="https://www.behance.net/kristiandavis3" target="_blank" rel="noopener noreferrer" aria-label="Behance – opens in new tab">Behance</a>
    </div>

    <footer>
    </footer>
  </div>
</body>
</html>
